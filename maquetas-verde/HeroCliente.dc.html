<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Montserrat', -apple-system, sans-serif; }
    a { color: #1C4E2F; text-decoration: none; }
    a:hover { color: #143B23; }
  </style>
</helmet>

<div style="box-sizing: border-box; width: 1440px; height: 900px; background: #ffffff; color: #111111; display: flex; flex-direction: column; overflow: hidden;">

  <!-- NAVBAR: solo "Menú", como en la maqueta del cliente -->
  <div style="display: flex; justify-content: flex-end; align-items: center; padding: 30px 56px 0 56px;">
    <span style="font-weight: 700; font-size: 16px; padding-bottom: 6px; border-bottom: 3px solid #111111;">Menú</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 26px 56px 0 56px;">

    <!-- TITULAR GRIS CON ACENTO VERDE -->
    <div style="display: flex; flex-direction: column; gap: 18px;">
      <h1 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1.08; letter-spacing: -0.8px; text-transform: uppercase; color: #7c7c7c;">
        Adquiere ya tus cuentas<br>de <span style="color: #1C4E2F;">videojuegos.</span>
      </h1>
      <div style="display: flex; align-items: center; gap: 14px; padding-left: 4px;">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #111111; display: block;"></span>
        <span style="width: 56px; height: 2px; background: #111111; display: block;"></span>
        <span style="font-weight: 700; font-size: 12px; letter-spacing: 5px; text-transform: uppercase;">Tienda de cuentas</span>
      </div>
    </div>

    <!-- MARCA CENTRAL -->
    <div style="align-self: center; display: flex; flex-direction: column; align-items: center; gap: 22px;">
      <div style="display: flex; align-items: baseline; gap: 18px; font-weight: 900; font-size: 126px; line-height: 0.95; letter-spacing: -3px; text-transform: uppercase;">
        <span style="color: #1C4E2F;">Anxie</span>
        <span style="color: #000000;">Store</span>
      </div>
      <div style="display: flex; align-items: center; gap: 26px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <span style="font-weight: 700; font-size: 20px; color: #7c7c7c;">2 años</span>
          <span style="font-weight: 500; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #9a9a9a;">Vendiendo</span>
        </div>
        <span style="width: 1px; height: 32px; background: #e2e2e2; display: block;"></span>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <span style="font-weight: 700; font-size: 20px; color: #7c7c7c;">+700</span>
          <span style="font-weight: 500; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #9a9a9a;">Referencias</span>
        </div>
      </div>
    </div>

    <!-- ESQUINAS: mismas piezas del cliente, alineadas a una sola base -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; padding-bottom: 34px;">

      <div style="display: flex; flex-direction: column; gap: 14px; max-width: 420px;">
        <span style="align-self: flex-start; display: inline-flex; align-items: center; justify-content: center; padding: 15px 30px; border-radius: 50px; background: #1C4E2F; color: #ffffff; font-weight: 700; font-size: 13px; letter-spacing: 0.6px; text-transform: uppercase;">
          ¡Únete a Discord!
        </span>
        <p style="margin: 0; font-weight: 400; font-size: 15px; line-height: 1.5; color: #3a3a3a;">
          Únete a nuestra comunidad de Discord, resuelve dudas y adquiere tu cuenta.
        </p>
      </div>

      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 14px;">
        <span style="display: inline-flex; align-items: center; justify-content: center; padding: 16px 34px; border-radius: 50px; background: #000000; color: #ffffff; font-weight: 700; font-size: 15px; letter-spacing: 0.3px;">
          Ver catálogo
        </span>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
          <span style="font-weight: 600; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #8a8a8a;">En el catálogo</span>
          <span style="font-weight: 800; font-size: 30px; letter-spacing: -0.8px;"><span style="color: #1C4E2F;">+40</span> cuentas</span>
        </div>
      </div>

    </div>

  </div>

  <div style="background: #000000; height: 58px;"></div>

</div>
</x-dc>
</body>
</html>
