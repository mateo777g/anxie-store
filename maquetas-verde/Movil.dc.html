<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Montserrat', -apple-system, sans-serif; }
    a { color: #1C4E2F; text-decoration: none; }
    a:hover { color: #143B23; }
  </style>
</helmet>

<div style="box-sizing: border-box; width: 390px; height: 844px; background: #ffffff; color: #111111; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="logo.png" alt="Anxie Store" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
      <span style="font-weight: 600; font-size: 14px; letter-spacing: 0.8px;">ANXIE STORE</span>
    </div>
    <span style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.1" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
    </span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 8px 20px 0 20px;">

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <h1 style="margin: 0; font-weight: 800; font-size: 32px; line-height: 1.05; letter-spacing: -0.8px; text-transform: uppercase;">
        Adquiere ya tus cuentas de <span style="color: #1C4E2F;">videojuegos.</span>
      </h1>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #111111; display: block;"></span>
        <span style="width: 34px; height: 2px; background: #111111; display: block;"></span>
        <span style="font-weight: 700; font-size: 10px; letter-spacing: 3.5px; text-transform: uppercase;">Tienda de cuentas</span>
      </div>
    </div>

    <div style="align-self: center; display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <div style="display: flex; align-items: baseline; gap: 8px; font-weight: 900; font-size: 50px; line-height: 0.95; letter-spacing: -1.6px; text-transform: uppercase;">
        <span style="color: #1C4E2F;">Anxie</span>
        <span style="color: #000000;">Store</span>
      </div>
      <div style="display: flex; align-items: center; gap: 20px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <span style="font-weight: 800; font-size: 18px; letter-spacing: -0.3px;">2 años</span>
          <span style="font-weight: 600; font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: #8a8a8a;">Vendiendo</span>
        </div>
        <span style="width: 1px; height: 28px; background: #e2e2e2; display: block;"></span>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <span style="font-weight: 800; font-size: 18px; letter-spacing: -0.3px; color: #1C4E2F;">+700</span>
          <span style="font-weight: 600; font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: #8a8a8a;">Referencias</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 22px;">

      <div style="display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 2px;">
        <span style="font-weight: 600; font-size: 10px; letter-spacing: 2.4px; text-transform: uppercase; color: #8a8a8a;">En el catálogo</span>
        <span style="font-weight: 800; font-size: 24px; letter-spacing: -0.6px;"><span style="color: #1C4E2F;">+40</span> cuentas</span>
      </div>

      <span style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 52px; border-radius: 50px; background: #1C4E2F; color: #ffffff; font-weight: 700; font-size: 15px; letter-spacing: 0.3px; box-shadow: 0 6px 18px rgba(28, 78, 47, 0.28);">
        Ver catálogo
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: #ffffff;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1C4E2F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </span>
      </span>

      <span style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 50px; border: 1.5px solid #1C4E2F; color: #1C4E2F; font-weight: 700; font-size: 15px; letter-spacing: 0.3px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1C4E2F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4Z"></path><path d="M9 10.5h.01M15 10.5h.01"></path></svg>
        Únete al Discord
      </span>

    </div>

  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 14px; background: #000000; color: #ffffff; height: 56px;">
    <span style="font-weight: 700; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;">PC</span>
    <span style="width: 4px; height: 4px; border-radius: 50%; background: #3E8B5C; display: block;"></span>
    <span style="font-weight: 700; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;">Xbox</span>
    <span style="width: 4px; height: 4px; border-radius: 50%; background: #3E8B5C; display: block;"></span>
    <span style="font-weight: 700; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;">PlayStation</span>
    <span style="width: 4px; height: 4px; border-radius: 50%; background: #3E8B5C; display: block;"></span>
    <span style="font-weight: 700; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;">Switch</span>
  </div>

</div>
</x-dc>
</body>
</html>
